name: prayer_walk
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  flutter_riverpod: ^3.3.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  intl: ^0.20.3
  supabase_flutter: ^2.16.0
  google_sign_in: ^7.2.0
  geolocator: ^14.0.3
  # Reverse geocoding only — see geocoding_service.dart. Supabase and Mapbox
  # tiles bring their own transports; this is for the one plain REST call.
  http: ^1.2.0
  shared_preferences: ^2.5.5
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  pedometer: ^4.2.0
  permission_handler: ^12.0.3
  image_picker: ^1.2.3
  image: ^4.9.1
  # Runtime package name / applicationId, read for the debug-only Google
  # sign-in config diagnostic — see auth_diagnostics_screen.dart.
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Build-time only. Both read the configuration blocks below and write into
  # android/ and ios/; neither ships in the app.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# --------------------------------------------------------------- launcher icon ---
#
# Source artwork is generated by `tool/generate_brand_assets.dart` — the same
# trail mark the app paints on its own splash. Regenerate with:
#
#   dart run tool/generate_brand_assets.dart
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  # Full-bleed pine ground. Also the legacy (pre-adaptive) Android icon.
  image_path: "assets/brand/icon.png"
  # Adaptive: a flat pine background with the mark floating over it, so the
  # launcher's mask and parallax have something to move against.
  adaptive_icon_background: "#223D30"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  adaptive_icon_monochrome: "assets/brand/icon_foreground.png"
  # The App Store rejects an icon with an alpha channel. `icon.png` is written
  # without one; this makes the generator strip it from every derived size too,
  # rather than trusting the source.
  remove_alpha_ios: true
  min_sdk_android: 21

# --------------------------------------------------------------- native splash ---
#
#   dart run flutter_native_splash:create
#
# The ground colours are the two app backgrounds — pine in light, the near-black
# forest (`AppColors.canvasDark`) in dark — so the native splash hands over to
# `splash_screen.dart` without a colour change. The mark is the same one, at
# roughly the same size, which is what makes the two read as one moment rather
# than two screens.
flutter_native_splash:
  color: "#223D30"
  color_dark: "#12201A"
  image: "assets/brand/splash.png"
  image_dark: "assets/brand/splash.png"
  android: true
  ios: true
  web: false
  # Android 12+ replaced the old full-screen splash with a masked centre icon.
  # It has its own asset slots because the sizing rules are different.
  android_12:
    color: "#223D30"
    color_dark: "#12201A"
    image: "assets/brand/splash.png"
    image_dark: "assets/brand/splash.png"
    icon_background_color: "#223D30"
    icon_background_color_dark: "#12201A"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # The offline floor for scripture on the trail. Public-domain text only
    # (World English Bible, British Edition) — see the file's own `licence`
    # field and supabase/seed/scripture_prompts_seed.sql.
    - assets/scripture/prompts.json
    # The arrival chime. Generated rather than sourced, so there is no third
    # party's licence attached to it — see the generator note in the deliverable.
    - assets/audio/scripture_chime.wav
    # The OFL text for both bundled families, put on the licence page by
    # AppTypography.registerFontLicences(). Loaded only if someone opens it.
    - assets/fonts/OFL-Fraunces.txt
    - assets/fonts/OFL-HankenGrotesk.txt
    # The source mark behind the launcher icon and the splash. Not drawn at
    # runtime — committed so the icon can be regenerated from it.
    - assets/brand/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # The typographic identity, bundled rather than fetched.
  #
  # Static instances, not the variable masters: Flutter maps `fontWeight` onto
  # declared faces, and a variable font would need every call site to carry a
  # `FontVariation` instead — including the handful that copyWith a weight onto
  # a theme style. Five faces, ~240 KB, which is what the theme actually asks
  # for. Audit `AppTypography` before adding a sixth.
  #
  # Both families are SIL OFL 1.1; the licence files sit beside them in
  # assets/fonts/ and are registered in AppTypography.registerFontLicences().
  fonts:
    # Display only — screen titles and stat numerals. One weight, because
    # nothing in the theme sets Fraunces at anything but 600.
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Regular.ttf
          weight: 400
        # 500 is the unselected tab label, and only that.
        - asset: assets/fonts/HankenGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/HankenGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HankenGrotesk-Bold.ttf
          weight: 700
