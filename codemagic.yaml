workflows:
  ios-smoke:
    name: iOS unsigned smoke build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.44.8
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter dependencies
        working_directory: prayer_walk
        script: flutter pub get
      - name: Build unsigned iOS
        working_directory: prayer_walk
        script: flutter build ios --release --no-codesign
    artifacts:
      - prayer_walk/ios/Podfile
      - prayer_walk/ios/Podfile.lock
      - prayer_walk/build/ios/iphoneos/*.app
      
  ios-sim:
    name: iOS simulator for screenshots
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.44.8
      xcode: latest
      cocoapods: default
      groups:
        - prayer_walk_env
    scripts:
      - name: Write env.json
        working_directory: prayer_walk
        script: |
          cat > env.json <<EOF
          {
            "SUPABASE_URL": "$SUPABASE_URL",
            "SUPABASE_PUBLISHABLE_KEY": "$SUPABASE_PUBLISHABLE_KEY",
            "GOOGLE_WEB_CLIENT_ID": "$GOOGLE_WEB_CLIENT_ID",
            "GOOGLE_IOS_CLIENT_ID": "$GOOGLE_IOS_CLIENT_ID",
            "MAPBOX_ACCESS_TOKEN": "$MAPBOX_ACCESS_TOKEN",
            "SCRIPTURE_TRANSLATION": "$SCRIPTURE_TRANSLATION"
          }
          EOF
      - name: Verify env.json
        working_directory: prayer_walk
        script: |
          python3 -c "import json;d=json.load(open('env.json'));print({k:('SET' if v else 'EMPTY') for k,v in d.items()})"
      - name: Flutter dependencies
        working_directory: prayer_walk
        script: flutter pub get
      - name: Build for simulator
        working_directory: prayer_walk
        script: flutter build ios --debug --simulator --dart-define-from-file=env.json